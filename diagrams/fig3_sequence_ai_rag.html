<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figure 3 - Sequence Diagram: AI Chatbot RAG Workflow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; font-family: 'Times New Roman', serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h2 { font-size: 14px; text-align: center; margin-bottom: 14px; font-weight: bold; }
</style>
</head>
<body>
<h2>Figure 3: Sequence Diagram – AI Chatbot RAG Workflow</h2>
<svg width="1100" height="870" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#222"/>
    </marker>
    <marker id="ret" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#666"/>
    </marker>
    <marker id="sse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- ═══ LIFELINE HEADERS ═══ -->
  <rect x="10"  y="14" width="110" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="65"  y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">User</text>
  <text x="65"  y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#1d4ed8">/ Browser</text>

  <rect x="180" y="14" width="120" height="40" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="240" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Django</text>
  <text x="240" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">ai_chat.py</text>

  <rect x="370" y="14" width="110" height="40" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="425" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">SQLite DB</text>
  <text x="425" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">(Context)</text>

  <rect x="555" y="14" width="120" height="40" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="615" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">System</text>
  <text x="615" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">Prompt Builder</text>

  <rect x="750" y="14" width="120" height="40" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="810" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Claude API</text>
  <text x="810" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">(Anthropic)</text>

  <rect x="950" y="14" width="120" height="40" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="1010" y="30" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">BotChat</text>
  <text x="1010" y="48" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">DB (History)</text>

  <!-- ═══ LIFELINES ═══ -->
  <line x1="65"   y1="54" x2="65"   y2="855" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="240"  y1="54" x2="240"  y2="855" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="425"  y1="54" x2="425"  y2="855" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="615"  y1="54" x2="615"  y2="855" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="810"  y1="54" x2="810"  y2="855" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="1010" y1="54" x2="1010" y2="855" stroke="#059669" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- ACTIVATION BOXES -->
  <rect x="60"  y="80" width="10" height="740" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="235" y="100" width="10" height="700" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <rect x="420" y="170" width="10" height="300" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
  <rect x="610" y="490" width="10" height="120" fill="#e9d5ff" stroke="#9333ea" stroke-width="1"/>
  <rect x="805" y="560" width="10" height="110" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <rect x="1005" y="100" width="10" height="300" fill="#a7f3d0" stroke="#059669" stroke-width="1"/>

  <!-- ════════════════════════════════════════ -->
  <!-- STEP 1: User sends message -->
  <rect x="0" y="80" width="1085" height="20" rx="2" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="8" y="94" font-size="9" fill="#1e40af" font-style="italic">Step 1 – User submits message</text>

  <line x1="70" y1="108" x2="232" y2="108" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="105" text-anchor="middle" font-size="9">POST /chat/bot/stream/ { message }</text>

  <!-- Rate limit check -->
  <rect x="175" y="118" width="130" height="18" rx="3" fill="#fff7ed" stroke="#fb923c" stroke-width="1"/>
  <text x="240" y="131" text-anchor="middle" font-size="9" fill="#c2410c">Rate limit check (1 req/s)</text>

  <!-- STEP 2: Save user message -->
  <rect x="0" y="142" width="1085" height="20" rx="2" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="8" y="156" font-size="9" fill="#166534" font-style="italic">Step 2 – Save user message to BotChatMessage</text>

  <line x1="240" y1="170" x2="1002" y2="170" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="620" y="167" text-anchor="middle" font-size="9">BotChatMessage.objects.create(role='user', content=msg)</text>
  <line x1="1005" y1="184" x2="248" y2="184" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="620" y="181" text-anchor="middle" font-size="9" fill="#666">saved</text>

  <!-- STEP 3: Context Retrieval -->
  <rect x="0" y="200" width="1085" height="20" rx="2" fill="#fffbeb" stroke="#fde68a"/>
  <text x="8" y="214" font-size="9" fill="#92400e" font-style="italic">Step 3 – RAG Context Retrieval (5 parallel queries)</text>

  <!-- 3a Orders -->
  <line x1="240" y1="228" x2="417" y2="228" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="328" y="225" text-anchor="middle" font-size="9">Query recent orders + trackings (last 5)</text>
  <line x1="420" y1="242" x2="248" y2="242" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="328" y="239" text-anchor="middle" font-size="9" fill="#666">orders_info string</text>

  <!-- 3b Wishlist -->
  <line x1="240" y1="256" x2="417" y2="256" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="328" y="253" text-anchor="middle" font-size="9">Query wishlist + category frequency analysis</text>
  <line x1="420" y1="270" x2="248" y2="270" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="328" y="267" text-anchor="middle" font-size="9" fill="#666">wishlist_info + fav_categories</text>

  <!-- 3c Recently viewed -->
  <line x1="240" y1="284" x2="417" y2="284" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="328" y="281" text-anchor="middle" font-size="9">Query session['recently_viewed'] books</text>
  <line x1="420" y1="298" x2="248" y2="298" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="328" y="295" text-anchor="middle" font-size="9" fill="#666">viewed_info string</text>

  <!-- 3d RAG keyword search -->
  <line x1="240" y1="312" x2="417" y2="312" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="328" y="309" text-anchor="middle" font-size="9">RAG: extract keywords → Q(title|author|category icontains)</text>
  <line x1="420" y1="326" x2="248" y2="326" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="328" y="323" text-anchor="middle" font-size="9" fill="#666">rag_books queryset (max 8)</text>

  <!-- 3e New + Bestsellers -->
  <line x1="240" y1="340" x2="417" y2="340" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="328" y="337" text-anchor="middle" font-size="9">Query new arrivals (90d) + bestsellers (top 5)</text>
  <line x1="420" y1="354" x2="248" y2="354" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="328" y="351" text-anchor="middle" font-size="9" fill="#666">new_books_info + bestseller_info</text>

  <!-- 3f Conversation history -->
  <line x1="240" y1="368" x2="1002" y2="368" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="620" y="365" text-anchor="middle" font-size="9">Load conversation history (last 10 messages)</text>
  <line x1="1005" y1="382" x2="248" y2="382" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="620" y="379" text-anchor="middle" font-size="9" fill="#666">messages_payload list</text>

  <!-- STEP 4: Build System Prompt -->
  <rect x="0" y="400" width="1085" height="20" rx="2" fill="#fdf4ff" stroke="#e9d5ff"/>
  <text x="8" y="414" font-size="9" fill="#7e22ce" font-style="italic">Step 4 – Build System Prompt with all context</text>

  <line x1="240" y1="428" x2="607" y2="428" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="424" y="425" text-anchor="middle" font-size="9">build_system_prompt(store_info + all_context)</text>

  <rect x="530" y="438" width="165" height="42" rx="3" fill="#faf5ff" stroke="#c084fc" stroke-width="1"/>
  <text x="612" y="453" text-anchor="middle" font-size="8">System Prompt includes:</text>
  <text x="612" y="466" text-anchor="middle" font-size="8">store info · orders · wishlist</text>
  <text x="612" y="478" text-anchor="middle" font-size="8">RAG results · new · bestsellers</text>

  <!-- STEP 5: Call Claude API -->
  <rect x="0" y="492" width="1085" height="20" rx="2" fill="#fff1f2" stroke="#fda4af"/>
  <text x="8" y="506" font-size="9" fill="#9f1239" font-style="italic">Step 5 – Call Claude API (Streaming SSE)</text>

  <line x1="240" y1="522" x2="802" y2="522" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="519" text-anchor="middle" font-size="9">POST api.anthropic.com/v1/messages (stream=True, model=claude-sonnet-4)</text>

  <!-- SSE chunks -->
  <line x1="805" y1="540" x2="73" y2="552" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,3" marker-end="url(#sse)"/>
  <text x="437" y="545" text-anchor="middle" font-size="9" fill="#dc2626">SSE chunk 1: data: {"chunk": "Chào..."}</text>

  <line x1="805" y1="562" x2="73" y2="574" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,3" marker-end="url(#sse)"/>
  <text x="437" y="567" text-anchor="middle" font-size="9" fill="#dc2626">SSE chunk 2: data: {"chunk": " bạn ..."}</text>

  <text x="437" y="591" text-anchor="middle" font-size="9" fill="#dc2626">... (streaming token by token, typing effect in browser)</text>

  <line x1="805" y1="600" x2="73" y2="612" stroke="#dc2626" stroke-width="2" stroke-dasharray="7,3" marker-end="url(#sse)"/>
  <text x="437" y="605" text-anchor="middle" font-size="9" fill="#dc2626">SSE chunk N: data: {"chunk": "[SUGGESTIONS: ...]"}</text>

  <!-- STEP 6: Post-processing -->
  <rect x="0" y="626" width="1085" height="20" rx="2" fill="#f0fdf4" stroke="#86efac"/>
  <text x="8" y="640" font-size="9" fill="#166534" font-style="italic">Step 6 – Post-processing: Parse special tags from full response</text>

  <rect x="185" y="648" width="470" height="56" rx="3" fill="#f0fdf4" stroke="#4ade80" stroke-width="1"/>
  <text x="420" y="663" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">Parse &amp; Execute Commands:</text>
  <text x="420" y="677" text-anchor="middle" font-size="9">[SUGGESTIONS] → extract chip list</text>
  <text x="420" y="691" text-anchor="middle" font-size="9">[SET_PRICE_ALERT: book_id=X, target=Y] → PriceAlert.objects.create()</text>
  <text x="420" y="705" text-anchor="middle" font-size="9">[TRACK_GUEST_ORDER: order_id=Z] → session['guest_orders'].append(Z)</text>

  <!-- STEP 7: Save AI response -->
  <rect x="0" y="716" width="1085" height="20" rx="2" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="8" y="730" font-size="9" fill="#065f46" font-style="italic">Step 7 – Save AI response + Send final metadata to browser</text>

  <line x1="240" y1="745" x2="1002" y2="745" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="620" y="742" text-anchor="middle" font-size="9">BotChatMessage.objects.create(role='assistant', content=cleaned_text)</text>

  <line x1="240" y1="764" x2="73" y2="764" stroke="#666" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#ret)"/>
  <text x="155" y="761" text-anchor="middle" font-size="9" fill="#666">SSE: {"metadata": {books, orders, suggestions, alert}}</text>

  <!-- STEP 8: Render in Browser -->
  <rect x="0" y="784" width="1085" height="20" rx="2" fill="#eff6ff" stroke="#c7d2fe"/>
  <text x="8" y="798" font-size="9" fill="#3730a3" font-style="italic">Step 8 – Browser renders AI response + Book cards + Suggestion chips</text>

  <rect x="10" y="805" width="140" height="30" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="80" y="823" text-anchor="middle" font-size="9">Typing animation complete</text>
  <text x="80" y="835" text-anchor="middle" font-size="8">Book cards + chips rendered</text>

  <!-- Bottom labels -->
  <text x="65"   y="857" text-anchor="middle" font-size="9" fill="#1d4ed8">Browser</text>
  <text x="240"  y="857" text-anchor="middle" font-size="9" fill="#15803d">ai_chat.py</text>
  <text x="425"  y="857" text-anchor="middle" font-size="9" fill="#92400e">SQLite DB</text>
  <text x="615"  y="857" text-anchor="middle" font-size="9" fill="#7e22ce">Prompt Builder</text>
  <text x="810"  y="857" text-anchor="middle" font-size="9" fill="#991b1b">Claude API</text>
  <text x="1010" y="857" text-anchor="middle" font-size="9" fill="#065f46">BotChat DB</text>
</svg>
</body>
</html>
