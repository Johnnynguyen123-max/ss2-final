<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figure 2 - Sequence Diagram: Shopping Workflow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; font-family: 'Times New Roman', serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h2 { font-size: 14px; text-align: center; margin-bottom: 14px; font-weight: bold; }
</style>
</head>
<body>
<h2>Figure 2: Sequence Diagram – Shopping and Checkout Workflow</h2>
<svg width="1050" height="780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#222"/>
    </marker>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- ═══ LIFELINE HEADERS ═══ -->
  <!-- User -->
  <rect x="30" y="20" width="110" height="36" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="85" y="43" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">User / Browser</text>

  <!-- Django Cart View -->
  <rect x="230" y="20" width="120" height="36" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="290" y="38" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Django</text>
  <text x="290" y="51" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">cart.py / views</text>

  <!-- Session Store -->
  <rect x="430" y="20" width="110" height="36" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="485" y="38" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Session</text>
  <text x="485" y="51" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">Store</text>

  <!-- Django ORM -->
  <rect x="620" y="20" width="110" height="36" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="675" y="38" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">Django ORM</text>
  <text x="675" y="51" text-anchor="middle" font-size="10" font-weight="bold" fill="#7e22ce">transaction</text>

  <!-- SQLite DB -->
  <rect x="820" y="20" width="110" height="36" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="875" y="38" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">SQLite</text>
  <text x="875" y="51" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Database</text>

  <!-- ═══ LIFELINES ═══ -->
  <line x1="85"  y1="56" x2="85"  y2="760" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="290" y1="56" x2="290" y2="760" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="485" y1="56" x2="485" y2="760" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="675" y1="56" x2="675" y2="760" stroke="#9333ea" stroke-width="1.2" stroke-dasharray="6,4"/>
  <line x1="875" y1="56" x2="875" y2="760" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="6,4"/>

  <!-- ═══ ACTIVATION BOXES ═══ -->
  <rect x="80"  y="100" width="10" height="620" fill="#bfdbfe" stroke="#2563eb" stroke-width="1"/>
  <rect x="285" y="120" width="10" height="580" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <rect x="480" y="150" width="10" height="160" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
  <rect x="670" y="430" width="10" height="270" fill="#e9d5ff" stroke="#9333ea" stroke-width="1"/>
  <rect x="870" y="460" width="10" height="240" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════ -->
  <!-- STEP 1: Browse catalog -->
  <rect x="10" y="90" width="960" height="22" rx="3" fill="#f0f4ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="18" y="105" font-size="10" fill="#3730a3" font-style="italic">1. Browse Book Catalog</text>

  <line x1="90" y1="110" x2="282" y2="110" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="107" text-anchor="middle" font-size="10">GET /  (query, category, filter)</text>
  <line x1="285" y1="124" x2="93" y2="124" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="185" y="121" text-anchor="middle" font-size="10" fill="#555">render(home.html, books)</text>

  <!-- STEP 2: Add to Cart -->
  <rect x="10" y="138" width="960" height="22" rx="3" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="18" y="153" font-size="10" fill="#166534" font-style="italic">2. Add to Cart</text>

  <line x1="90" y1="160" x2="282" y2="160" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="157" text-anchor="middle" font-size="10">POST /cart/add/&lt;book_id&gt;/</text>

  <line x1="290" y1="174" x2="477" y2="174" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="171" text-anchor="middle" font-size="10">check book.stock &gt; 0</text>

  <line x1="480" y1="188" x2="292" y2="188" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="382" y="185" text-anchor="middle" font-size="10" fill="#555">stock ok</text>

  <line x1="290" y1="202" x2="477" y2="202" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="199" text-anchor="middle" font-size="10">session['cart'][book_id] += qty</text>

  <line x1="285" y1="216" x2="93" y2="216" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="185" y="213" text-anchor="middle" font-size="10" fill="#555">JsonResponse {status:'success', total_items}</text>

  <!-- STEP 3: View Cart -->
  <rect x="10" y="230" width="960" height="22" rx="3" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="18" y="245" font-size="10" fill="#92400e" font-style="italic">3. View Cart</text>

  <line x1="90" y1="252" x2="282" y2="252" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="249" text-anchor="middle" font-size="10">GET /cart/</text>

  <line x1="290" y1="266" x2="477" y2="266" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="263" text-anchor="middle" font-size="10">read session['cart']</text>

  <line x1="480" y1="280" x2="292" y2="280" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="382" y="277" text-anchor="middle" font-size="10" fill="#555">cart dict {book_id: qty}</text>

  <line x1="285" y1="294" x2="93" y2="294" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="185" y="291" text-anchor="middle" font-size="10" fill="#555">render(cart.html, cart_items, total)</text>

  <!-- STEP 4: GET Checkout -->
  <rect x="10" y="310" width="960" height="22" rx="3" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="18" y="325" font-size="10" fill="#7e22ce" font-style="italic">4. Checkout (GET)</text>

  <line x1="90" y1="332" x2="282" y2="332" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="329" text-anchor="middle" font-size="10">GET /checkout/</text>

  <line x1="285" y1="346" x2="93" y2="346" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="185" y="343" text-anchor="middle" font-size="10" fill="#555">render(checkout.html, items, coupons)</text>

  <!-- STEP 5: AJAX Coupon -->
  <rect x="10" y="362" width="960" height="22" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="18" y="377" font-size="10" fill="#065f46" font-style="italic">5. Validate Coupon (AJAX)</text>

  <line x1="90" y1="382" x2="282" y2="382" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="379" text-anchor="middle" font-size="10">POST /cart/coupon/validate/ {code, total}</text>

  <line x1="285" y1="396" x2="93" y2="396" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="185" y="393" text-anchor="middle" font-size="10" fill="#555">JsonResponse {valid, discount_percent, new_total}</text>

  <!-- STEP 6: POST Checkout -->
  <rect x="10" y="420" width="960" height="22" rx="3" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
  <text x="18" y="435" font-size="10" fill="#9f1239" font-style="italic">6. Place Order (POST Checkout) – Atomic Transaction</text>

  <line x1="90" y1="442" x2="282" y2="442" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="439" text-anchor="middle" font-size="10">POST /checkout/ {name, phone, address, coupon}</text>

  <!-- transaction.atomic box -->
  <rect x="300" y="455" width="580" height="200" rx="4" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="588" y="471" text-anchor="middle" font-size="9" fill="#7e22ce" font-style="italic">transaction.atomic()</text>

  <line x1="290" y1="480" x2="667" y2="480" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="477" text-anchor="middle" font-size="10">Book.filter(stock &gt;= qty).update(stock-=qty, sold+=qty)</text>

  <line x1="675" y1="494" x2="867" y2="494" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="491" text-anchor="middle" font-size="10">UPDATE books SET stock-=qty</text>

  <line x1="870" y1="508" x2="678" y2="508" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="770" y="505" text-anchor="middle" font-size="10" fill="#555">1 row updated</text>

  <line x1="675" y1="522" x2="867" y2="522" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="519" text-anchor="middle" font-size="10">INSERT INTO orders (user, name, phone, total)</text>

  <line x1="870" y1="536" x2="678" y2="536" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="770" y="533" text-anchor="middle" font-size="10" fill="#555">order.id = N</text>

  <line x1="675" y1="550" x2="867" y2="550" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="547" text-anchor="middle" font-size="10">INSERT INTO order_items (order, book, qty, price)</text>

  <line x1="870" y1="564" x2="678" y2="564" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="770" y="561" text-anchor="middle" font-size="10" fill="#555">items created</text>

  <line x1="675" y1="578" x2="867" y2="578" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="575" text-anchor="middle" font-size="10">UPDATE coupon used_count += 1</text>

  <line x1="870" y1="592" x2="678" y2="592" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="770" y="589" text-anchor="middle" font-size="10" fill="#555">ok</text>

  <!-- After transaction -->
  <line x1="290" y1="618" x2="477" y2="618" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="615" text-anchor="middle" font-size="10">session['cart'] = {}</text>

  <!-- STEP 7: Redirect -->
  <rect x="10" y="638" width="960" height="22" rx="3" fill="#f0f4ff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="18" y="653" font-size="10" fill="#3730a3" font-style="italic">7. Order Success</text>

  <line x1="285" y1="660" x2="93" y2="660" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="185" y="657" text-anchor="middle" font-size="10" fill="#555">redirect(/orders/success/&lt;order_id&gt;/)</text>

  <line x1="90" y1="680" x2="282" y2="680" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="185" y="677" text-anchor="middle" font-size="10">GET /orders/success/N/</text>

  <line x1="285" y1="694" x2="93" y2="694" stroke="#555" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrowB)"/>
  <text x="185" y="691" text-anchor="middle" font-size="10" fill="#555">render(order_success.html)</text>

  <!-- ═══ COLUMN LABELS (bottom) ═══ -->
  <text x="85"  y="755" text-anchor="middle" font-size="9" fill="#1d4ed8">User</text>
  <text x="290" y="755" text-anchor="middle" font-size="9" fill="#15803d">cart.py</text>
  <text x="485" y="755" text-anchor="middle" font-size="9" fill="#92400e">Session</text>
  <text x="675" y="755" text-anchor="middle" font-size="9" fill="#7e22ce">ORM/Atomic</text>
  <text x="875" y="755" text-anchor="middle" font-size="9" fill="#991b1b">SQLite DB</text>
</svg>
</body>
</html>
