<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figure 1 - Use Case Diagram - DDC Books</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; font-family: 'Times New Roman', serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h2 { font-size: 14px; text-align: center; margin-bottom: 14px; font-weight: bold; }
  svg text { font-family: 'Times New Roman', serif; }
</style>
</head>
<body>
<h2>Figure 1: Use Case Diagram of the DDC Books System</h2>

  <!-- System Boundary -->

  <ellipse cx="590" cy="570" rx="90" ry="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>

  <ellipse cx="590" cy="620" rx="90" ry="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>

  <line x1="910" y1="220" x2="810" y2="192" stroke="#9333ea" stroke-width="1.2"/>

  <line x1="910" y1="230" x2="810" y2="292" stroke="#9333ea" stroke-width="1.2"/>
